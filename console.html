<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketing Console</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e8eaed; --mut:#9aa3b2;
          --accent:#4f8cff; --ok:#2ecc71; --warn:#f5a623; --bad:#ff5c5c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); padding-bottom:env(safe-area-inset-bottom); }
  header { padding:14px 16px; border-bottom:1px solid var(--line); position:sticky; top:0;
           background:var(--bg); display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:17px } header small { color:var(--mut) }
  nav { display:flex; overflow-x:auto; border-bottom:1px solid var(--line); position:sticky;
        top:53px; background:var(--bg); z-index:5; }
  nav button { flex:1 0 auto; background:none; border:none; color:var(--mut); padding:12px 16px;
        font-size:15px; border-bottom:2px solid transparent; }
  nav button.on { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:16px; max-width:680px; margin:0 auto; }
  .tab { display:none } .tab.on { display:block }
  label { display:block; color:var(--mut); font-size:13px; margin:12px 0 4px; }
  textarea, input, select { width:100%; background:var(--panel); border:1px solid var(--line);
        color:var(--fg); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:96px; resize:vertical }
  button.act { width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px;
        padding:14px; font-size:16px; font-weight:600; margin-top:14px; }
  button.act.danger { background:var(--bad) } button.ghost { background:var(--panel); color:var(--fg);
        border:1px solid var(--line); border-radius:10px; padding:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px }
  .chip { padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:var(--panel);
        color:var(--mut); font-size:14px; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent) }
  .chip .g { font-size:11px; opacity:.7 }
  .row { display:flex; align-items:center; gap:10px; margin-top:12px }
  .row label { margin:0 } .switch { width:auto }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px;
        margin-top:10px; font-size:14px; }
  .res { font-size:13px } .res .ok{color:var(--ok)} .res .skip{color:var(--warn)} .res .bad{color:var(--bad)}
  pre { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; color:var(--mut); font-size:12px }
  .gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center;
        justify-content:center; padding:24px; z-index:50 }
  .gate .box { width:100%; max-width:340px } .hide { display:none !important }
  .muted { color:var(--mut); font-size:13px } .mt { margin-top:14px }
</style>
</head>
<body>
<div class="gate" id="gate"><div class="box">
  <b>Marketing Console</b>
  <p class="muted">Enter your access token to continue.</p>
  <input id="tok" type="password" placeholder="access token" autocomplete="off" autofocus
         onkeydown="if(event.key==='Enter')login()">
  <button class="act" onclick="login()">Unlock</button>
  <p class="muted" id="gateErr"></p>
</div></div>

<header><b>Marketing Console</b><small id="who">MiddleMatter</small></header>
<nav id="nav"></nav>
<main>
  <section class="tab on" id="t-compose">
    <label>Message</label><textarea id="c-text" placeholder="What do you want to say?"></textarea>
    <label>Link (optional)</label><input id="c-link" placeholder="https://…">
    <label>Platforms</label><div class="chips" id="c-plats"></div>
    <div class="row"><input class="switch" type="checkbox" id="c-dry" checked><label for="c-dry">Dry-run (preview only — don't post)</label></div>
    <button class="act" id="c-go" onclick="broadcast()">Preview / Broadcast</button>
    <div id="c-out"></div>
  </section>

  <section class="tab" id="t-campaigns">
    <label>New drip — name</label><input id="cm-name" placeholder="Spring Outreach">
    <label>Platforms</label><div class="chips" id="cm-plats"></div>
    <label>Steps — one per line as <code>days: message</code></label>
    <textarea id="cm-steps" placeholder="0: Kickoff — we're live!&#10;2: Reminder + link&#10;7: Last call"></textarea>
    <button class="act" onclick="createCampaign()">Create campaign</button>
    <div class="row"><button class="ghost" style="flex:1" onclick="tick('campaigns',true)">Tick (dry)</button>
      <button class="ghost" style="flex:1" onclick="tick('campaigns',false)">Tick (send)</button></div>
    <div id="cm-list" class="mt"></div>
  </section>

  <section class="tab" id="t-schedule">
    <label>When (ISO, e.g. 2026-07-01T13:00:00Z)</label><input id="s-at" placeholder="2026-07-01T13:00:00Z">
    <label>Message</label><textarea id="s-text" placeholder="One-off scheduled post"></textarea>
    <label>Platforms</label><div class="chips" id="s-plats"></div>
    <button class="act" onclick="addSchedule()">Schedule it</button>
    <div class="row"><button class="ghost" style="flex:1" onclick="tick('schedule',true)">Tick (dry)</button>
      <button class="ghost" style="flex:1" onclick="tick('schedule',false)">Tick (send)</button></div>
    <div id="s-list" class="mt"></div>
  </section>

  <section class="tab" id="t-monitor">
    <label>Search platforms for…</label><input id="m-q" placeholder="brand, mention, keyword">
    <button class="act" onclick="monitor()">Scan</button>
    <div id="m-out"></div>
    <h4 class="mt">Recent activity</h4><div id="m-hist"></div>
  </section>

  <section class="tab" id="t-chat">
    <p class="muted">Ask the AI marketing manager to draft, plan, or summarize.</p>
    <div id="ch-log"></div>
    <textarea id="ch-msg" placeholder="Draft a launch post and preview it everywhere…"></textarea>
    <button class="act" onclick="chat()">Send</button>
  </section>
</main>

<script>
const TABS = [["compose","Compose"],["campaigns","Campaigns"],["schedule","Schedule"],["monitor","Monitor"],["chat","Chat"]];
let TOKEN = localStorage.getItem("mc_token") || "";
let SESSION = null, PLATFORMS = [];
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };

async function call(method, path, body){
  const r = await fetch(path, {method, headers:{"X-Console-Token":TOKEN,
    ...(body?{"Content-Type":"application/json"}:{})}, body: body?JSON.stringify(body):undefined});
  if(r.status===401){ throw new Error("unauthorized"); }
  return r.json();
}
async function login(){
  TOKEN = $("#tok").value.trim();
  try{ await call("GET","/api/platforms"); localStorage.setItem("mc_token",TOKEN);
       $("#gate").classList.add("hide"); init(); }
  catch(e){ $("#gateErr").textContent = "Invalid token."; }
}
function buildNav(){
  const nav=$("#nav");
  TABS.forEach(([id,name],i)=>{ const b=el("button",i===0?"on":"",name);
    b.onclick=()=>{ document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); $("#t-"+id).classList.add("on");
      if(id==="campaigns")loadCampaigns(); if(id==="schedule")loadSchedule(); if(id==="monitor")loadHistory(); };
    nav.appendChild(b); });
}
function chips(container, selected){
  const c=$(container); c.innerHTML="";
  PLATFORMS.forEach(p=>{ const on = selected.includes(p.key);
    const e=el("div","chip"+(on?" on":""), `${p.label} <span class="g">${p.status}</span>`);
    e.dataset.key=p.key; e.onclick=()=>e.classList.toggle("on"); c.appendChild(e); });
}
function picked(container){ return [...document.querySelectorAll(container+" .chip.on")].map(e=>e.dataset.key); }

async function init(){
  const d = await call("GET","/api/platforms"); PLATFORMS=d.platforms;
  chips("#c-plats", d.working); chips("#cm-plats", d.working); chips("#s-plats", d.working);
}
async function broadcast(){
  const out=$("#c-out"); out.innerHTML="<p class='muted'>working…</p>";
  const d = await call("POST","/api/broadcast",{ text:$("#c-text").value, link:$("#c-link").value,
    platforms:picked("#c-plats"), dry_run:$("#c-dry").checked });
  out.innerHTML = `<div class="card"><b>${d.dry_run?"Preview (not posted)":"Posted"}</b> · `+
    `${d.summary.posted} sent / ${d.summary.skipped} skipped / ${d.summary.failed} failed`+
    `<div class="res mt">`+ d.results.map(r=>{
      const cls = r.skipped?"skip":(r.ok?"ok":"bad"); const tag=r.skipped?"skip":(r.ok?"ok":"FAIL");
      return `<div class="${cls}">[${tag}] ${r.platform} — ${r.url||r.error||""}</div>`;}).join("")+`</div></div>`;
}
async function createCampaign(){
  const steps=$("#cm-steps").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.indexOf(":"); return {offset_days:parseFloat(l.slice(0,i))||0, text:l.slice(i+1).trim()};});
  const d=await call("POST","/api/campaigns",{name:$("#cm-name").value, platforms:picked("#cm-plats"), steps});
  alert(d.created?("Created "+d.created):JSON.stringify(d)); loadCampaigns();
}
async function loadCampaigns(){
  const d=await call("GET","/api/campaigns"); const box=$("#cm-list"); box.innerHTML="";
  (d.campaigns||[]).forEach(c=>{ const card=el("div","card",
    `<b>${c.name}</b> <span class="muted">(${c.status})</span><br>${c.sent}/${c.total} sent · ${c.platforms.join(", ")}`);
    const row=el("div","row");
    ["pause","resume"].forEach(a=>{ const b=el("button","ghost",a); b.style.flex="1";
      b.onclick=async()=>{ await call("POST",`/api/campaigns/${c.id}/${a}`); loadCampaigns(); }; row.appendChild(b);});
    card.appendChild(row); box.appendChild(card); });
}
async function addSchedule(){
  const d=await call("POST","/api/schedule",{at:$("#s-at").value, text:$("#s-text").value, platforms:picked("#s-plats")});
  alert(d.added?("Scheduled "+d.added+" for "+d.at):JSON.stringify(d)); loadSchedule();
}
async function loadSchedule(){
  const d=await call("GET","/api/schedule"); const box=$("#s-list"); box.innerHTML="";
  (d.schedule||[]).forEach(i=>box.appendChild(el("div","card",
    `<b>${i.status}</b> · ${i.at}<br>${i.text} <span class="muted">→ ${i.platforms.join(", ")}</span>`)));
}
async function tick(kind, send){
  const d=await call("POST",`/api/${kind}/tick`,{dry_run:!send});
  alert(JSON.stringify(d)); if(kind==="campaigns")loadCampaigns(); else loadSchedule();
}
async function monitor(){
  const out=$("#m-out"); out.innerHTML="<p class='muted'>scanning…</p>";
  const d=await call("POST","/api/monitor",{query:$("#m-q").value});
  out.innerHTML = Object.entries(d.results).map(([p,rows])=>{
    const body = Array.isArray(rows) ? (rows.length?rows.slice(0,8).map(r=>`• ${r.text||r.title||""}`).join("<br>"):"—")
      : `<span class="muted">${rows.error||"n/a"}</span>`;
    return `<div class="card"><b>${p}</b><pre>${body}</pre></div>`;}).join("");
}
async function loadHistory(){
  const d=await call("GET","/api/history?tail=15"); const box=$("#m-hist"); box.innerHTML="";
  (d.history||[]).slice().reverse().forEach(h=>box.appendChild(el("div","card",
    `<span class="muted">${h.ts}</span> · ${h.source}<br>${(h.text||"").slice(0,80)}`)));
}
async function chat(){
  const msg=$("#ch-msg").value.trim(); if(!msg)return; const log=$("#ch-log");
  log.appendChild(el("div","card","<b>you</b><br>"+msg)); $("#ch-msg").value="";
  const wait=el("div","card","<span class='muted'>thinking…</span>"); log.appendChild(wait);
  try{ const d=await call("POST","/api/chat",{message:msg, session_id:SESSION});
    SESSION=d.session_id; wait.innerHTML="<b>manager</b><br>"+(d.reply||"(no reply)").replace(/\n/g,"<br>"); }
  catch(e){ wait.innerHTML="<span class='res'><span class='bad'>error: "+e.message+"</span></span>"; }
}
buildNav();
if(TOKEN){ call("GET","/api/platforms").then(()=>{ $("#gate").classList.add("hide"); init(); }).catch(()=>{}); }
</script>
</body>
</html>
