<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketing Console</title>
<link rel="stylesheet" href="/console.css">
<!-- No inline script/style/handlers anywhere in this file: the edge CSP is
     script-src 'self'; style-src 'self'. Logic lives in /console.js (wire()). -->
</head>
<body>
<div class="gate" id="gate"><div class="box">
  <b>Marketing Console</b>
  <p class="muted">Enter your access token to continue.</p>
  <input id="tok" type="password" placeholder="access token" autocomplete="off" autofocus>
  <button class="act" id="tok-go">Unlock</button>
  <p class="muted" id="gateErr"></p>
</div></div>

<div class="gate hide" id="wel"><div class="box" id="welBox"></div></div>

<header><b id="brand">Marketing Console</b><small id="who">tour ▸</small></header>
<nav id="nav"></nav>
<main>
  <section class="tab on" id="t-compose">
    <label>Message</label><textarea id="c-text" placeholder="What do you want to say?"></textarea>
    <label>Link (optional)</label><input id="c-link" placeholder="https://…">
    <label>Platforms</label><div class="chips" id="c-plats"></div>
    <div class="row"><input class="switch" type="checkbox" id="c-dry" checked><label for="c-dry">Dry-run (preview only — don't post)</label></div>
    <button class="act" id="c-go">Preview / Broadcast</button>
    <div id="c-out"></div>
  </section>

  <section class="tab" id="t-campaigns">
    <label>New drip — name</label><input id="cm-name" placeholder="Spring Outreach">
    <label>Platforms</label><div class="chips" id="cm-plats"></div>
    <label>Steps — one per line as <code>days: message</code></label>
    <textarea id="cm-steps" placeholder="0: Kickoff — we're live!&#10;2: Reminder + link&#10;7: Last call"></textarea>
    <button class="act" id="cm-create">Create campaign</button>
    <div class="row"><button class="ghost f1" id="cm-tickdry">Tick (dry)</button>
      <button class="ghost f1" id="cm-ticksend">Tick (send)</button></div>
    <div id="cm-list" class="mt"></div>
  </section>

  <section class="tab" id="t-schedule">
    <label>When (ISO, e.g. 2026-07-01T13:00:00Z)</label><input id="s-at" placeholder="2026-07-01T13:00:00Z">
    <label>Message</label><textarea id="s-text" placeholder="One-off scheduled post"></textarea>
    <label>Platforms</label><div class="chips" id="s-plats"></div>
    <button class="act" id="s-add">Schedule it</button>
    <div class="row"><button class="ghost f1" id="s-tickdry">Tick (dry)</button>
      <button class="ghost f1" id="s-ticksend">Tick (send)</button></div>
    <div id="s-list" class="mt"></div>
  </section>

  <section class="tab" id="t-monitor">
    <label>Search platforms for…</label><input id="m-q" placeholder="brand, mention, keyword">
    <button class="act" id="m-go">Scan</button>
    <div id="m-out"></div>
    <h4 class="mt">Recent activity</h4><div id="m-hist"></div>
  </section>

  <section class="tab" id="t-guide"><div id="g-body"></div></section>

  <section class="tab" id="t-chat">
    <p class="muted">Ask the AI marketing manager to draft, plan, or summarize.</p>
    <div id="ch-log"></div>
    <textarea id="ch-msg" placeholder="Draft a launch post and preview it everywhere…"></textarea>
    <button class="act" id="ch-go">Send</button>
  </section>
</main>

<script src="/console.js"></script>
</body>
</html>
